<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
    <title>Gabriel Sobral · Portfolio</title>
    <meta name="description" content="Gabriel de Souza Rezende Sobral — Frontend Developer (React & TypeScript), comfortable across the stack. Open to remote work." />
    <meta property="og:title" content="Gabriel Sobral · Frontend Developer" />
    <meta property="og:description" content="Frontend Developer (React & TypeScript), comfortable across the stack. Open to remote work." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#efede6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the theme before first paint. Mirrors ThemeProvider.
      try {
        var pref = localStorage.getItem('gabriel-status.theme')
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
