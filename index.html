<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabriel Sobral · Portfolio</title>
    <meta name="description" content="Gabriel de Souza Rezende Sobral — Frontend Engineer, comfortable across the stack. Open to remote work. Portfolio presented as a live status page." />
    <meta property="og:title" content="Gabriel Sobral · All systems operational" />
    <meta property="og:description" content="Frontend Engineer, comfortable across the stack. Open to remote work." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the theme before first paint. Mirrors ThemeProvider.
      try {
        var pref = localStorage.getItem('gabriel-status.theme')
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
